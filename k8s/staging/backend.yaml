apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 15s }
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 623028180231.dkr.ecr.ap-south-1.amazonaws.com/todo-capstone-backend:v8-fd395fb
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: db-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: staging
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
