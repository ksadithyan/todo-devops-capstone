name: Promote or Rollback Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy to prod (e.g. 7-char commit SHA)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update prod image tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          sed -i "s|todo-capstone-backend:.*|todo-capstone-backend:$IMAGE_TAG|g" k8s/prod/backend.yaml
          sed -i "s|todo-capstone-frontend:.*|todo-capstone-frontend:$IMAGE_TAG|g" k8s/prod/frontend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/prod/
          git diff --cached --quiet || git commit -m "gitops: update prod to $IMAGE_TAG"
          git push
