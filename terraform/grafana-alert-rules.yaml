apiVersion: 1

groups:
  - orgId: 1
    name: todo-capstone-alerts
    folder: Capstone Alerts
    interval: 60s
    rules:
      - uid: app_pod_restarting
        title: App Pod Restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'sum(increase(kube_pod_container_status_restarts_total{namespace=~"staging|prod"}[5m])) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "App pod restarted in staging or prod"
        labels:
          severity: critical

      - uid: high_cluster_cpu
        title: High Cluster CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "EKS cluster CPU usage is above 80%"
        labels:
          severity: warning
